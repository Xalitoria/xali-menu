title = "Menu {where}"
size = 9
commands = ["xr"]
args = ["where"]
open-with = [
  { type = region-enter, regions = ["zone"], args = ["in {region} {world}"] }
  { type = region-leave, regions = ["zone"], args = ["out {region}"] }
]
items {
  inside { material = stone, slot = 0, name = "inside zone", view.require = [{ condition { type = region, names = ["zone"] } }] }
  anywhere { material = dirt, slot = 1, name = "in any region", view.require = [{ condition { type = region } }] }
  outside { material = coal, slot = 2, name = "no region", view.require = [{ condition { type = not, condition { type = region } } }] }
}
