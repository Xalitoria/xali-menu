title = "Text input"
size = 9
commands = ["xu"]
items {
  auto { material = name_tag, slot = 0, click.any.actions = [
    { type = input, prompt = "&eName your home", title = "Home", initial = "start", submit = "Save", match = "[a-z]+", invalid = "&cLetters only", timeout = 8s,
      then = [ { type = message, text = "dialog says {input}" } ], on-cancel = [ { type = message, text = "dialog cancelled" } ] } ] }
  anvil { material = anvil, slot = 1, click.any.actions = [
    { type = input, mode = ANVIL, prompt = "&eName your home", initial = "start", match = "[a-z]+", invalid = "&cLetters only", timeout = 8s,
      then = [ { type = message, text = "anvil says {input}" } ], on-cancel = [ { type = message, text = "anvil cancelled" } ] } ] }
}
