# EssentialsX in-game kit editor: /kiteditor <kit> (aliases: /editkit, /kitedit; never overrides e-command aliases)
title = "&8Kit Editor: &e{kit}"
size = 45
commands = ["kiteditor", "editkit", "kitedit"]
args = ["kit"]
complete {
  kit = ["@kiteditor:kits"]
}
open {
  require = [
    {
      condition { type = permission, node = "essentials.createkit" }
      deny = [{ type = message, text = "&cYou do not have permission to edit kits." }]
    }
    {
      condition { type = "kiteditor:exists", name = "{kit}" }
      deny = [{ type = message, text = "&cKit '{kit}' does not exist." }]
    }
  ]
}
matrix {
  cells = [
    "#########"
    "#.......#"
    "#.......#"
    "#.......#"
    "#########"
  ]
  map { "#" = border }
}
pages {
  catalog { type = "kiteditor:items", kit = "{kit}" }
  slots = [
    10, 11, 12, 13, 14, 15, 16,
    19, 20, 21, 22, 23, 24, 25,
    28, 29, 30, 31, 32, 33, 34
  ]
  item {
    material = "kiteditor:{kit}/{slot}"
    amount = "{amount}"
    "kiteditor:append-lore" {
      lines = [
        ""
        "&eLeft-click &7to copy to inventory"
        "&cRight-click &7to remove from kit"
      ]
    }
    click {
      left.actions = [{ type = "kiteditor:give-item", kit = "{kit}", slot = "{slot}" }]
      right.actions = [{ type = "kiteditor:remove-item", kit = "{kit}", slot = "{slot}" }]
    }
  }
  empty {
    material = barrier
    name = "&cThis kit has no items yet"
    lore = ["&7Use 'Add Held Item' or 'Import Inventory' below"]
  }
}
items {
  border {
    material = gray_stained_glass_pane
    name = " "
    hide-tooltip = true
  }
  back {
    material = book
    slot = 36
    priority = -1
    name = "&eBack to Kits"
    click.any.actions = [{ type = "open", menu = "kits" }]
  }
  add-held {
    material = hopper
    slot = 37
    priority = -1
    name = "&aAdd Held Item"
    lore = ["&7Adds a copy of the item", "&7in your main hand to this kit"]
    click.any.actions = [{ type = "kiteditor:add-held", kit = "{kit}" }]
  }
  prev {
    material = arrow
    slot = 38
    priority = -1
    name = "&ePrevious Page"
    lore = ["&7Page {page_prev}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  import-inv {
    material = chest
    slot = 39
    priority = -1
    name = "&bImport Inventory"
    lore = ["&7Replaces this kit's items with", "&7every item in your inventory"]
    click.any.actions = [{ type = "kiteditor:import-inventory", kit = "{kit}" }]
  }
  delay {
    material = clock
    slot = 40
    priority = -1
    update = true
    name = "&6Kit Delay"
    lore = ["", "&eClick &7to change cooldown (seconds)", "&8Use -1 for one-time, 0 for none"]
    "kiteditor:kit-info" { kit = "{kit}" }
    click.any.actions = [{
      type = input
      prompt = "&eEnter delay in seconds (-1 for one-time, 0 for none):"
      title = "Kit Delay"
      submit = "Save"
      match = "-?[0-9]+"
      invalid = "&cEnter a whole number of seconds (-1 or above)."
      then = [
        { type = "kiteditor:set-delay", kit = "{kit}", delay = "{input}" }
        { type = "open", menu = "kiteditor", args = ["{kit}"] }
      ]
      on-cancel = [{ type = "open", menu = "kiteditor", args = ["{kit}"] }]
    }]
  }
  preview {
    material = ender_eye
    slot = 41
    priority = -1
    name = "&dPreview Kit"
    lore = ["&7View this kit as players see it"]
    click.any.actions = [{ type = "open", menu = "kitpreview", args = ["{kit}"] }]
  }
  next {
    material = arrow
    slot = 42
    priority = -1
    name = "&eNext Page"
    lore = ["&7Page {page_next}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  delete {
    material = tnt
    slot = 43
    priority = -1
    name = "&cDelete Kit"
    lore = ["&7Permanently removes this kit"]
    view.require = [{ condition { type = permission, node = "essentials.delkit" } }]
    click.any.actions = [
      { type = "kiteditor:delete", kit = "{kit}" }
      { type = "open", menu = "kits" }
    ]
  }
  close {
    material = barrier
    slot = 44
    priority = -1
    name = "&cClose"
    click.any.actions = [{ type = "close" }]
  }
}
