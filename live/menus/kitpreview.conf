# Preview the items inside an EssentialsX kit: /kitpreview <kit> (non-e showkit aliases; never overrides /eshowkit)
title = "&8Kit Preview: &e{kit}"
size = 45
commands = ["kitpreview", "showkit", "kitshow", "preview"]
args = ["kit"]
complete {
  kit = ["@kitpreview:kits"]
}
open {
  require = [
    {
      condition { type = "kitpreview:authorized", node = "essentials.showkit" }
      deny = [{ type = message, text = "&cYou do not have permission to preview kits." }]
    }
    {
      condition { type = "kitpreview:exists", name = "{kit}" }
      deny = [{ type = message, text = "&cKit '{kit}' does not exist." }]
    }
  ]
}
matrix {
  cells = [
    "#########"
    "#.......#"
    "#.......#"
    "#.......#"
    "#########"
  ]
  map { "#" = border }
}
pages {
  catalog { type = "kitpreview:items", kit = "{kit}" }
  slots = [
    10, 11, 12, 13, 14, 15, 16,
    19, 20, 21, 22, 23, 24, 25,
    28, 29, 30, 31, 32, 33, 34
  ]
  item {
    material = "kitpreview:{kit}/{slot}"
    amount = "{amount}"
  }
  empty {
    material = barrier
    name = "&cThis kit has no items"
  }
}
items {
  border {
    material = gray_stained_glass_pane
    name = " "
    hide-tooltip = true
  }
  back {
    material = book
    slot = 36
    priority = -1
    name = "&eBack to Kits"
    click.any.actions = [{ type = "open", menu = "kits" }]
  }
  prev {
    material = arrow
    slot = 38
    priority = -1
    name = "&ePrevious Page"
    lore = ["&7Page {page_prev}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  close {
    material = barrier
    slot = 40
    priority = -1
    name = "&cClose"
    click.any.actions = [{ type = "close" }]
  }
  next {
    material = arrow
    slot = 42
    priority = -1
    name = "&eNext Page"
    lore = ["&7Page {page_next}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
  edit {
    material = anvil
    slot = 44
    priority = -1
    name = "&6Edit Kit"
    lore = ["&7Open this kit in the kit editor"]
    view.require = [{ condition { type = "kitpreview:authorized", node = "essentials.createkit" } }]
    click.any {
      require.require = [{
        condition { type = "kitpreview:authorized", node = "essentials.createkit" }
        deny = [{ type = message, text = "&cYou do not have permission to edit kits." }]
      }]
      actions = [{ type = "open", menu = "kiteditor", args = ["{kit}"] }]
    }
  }
}
