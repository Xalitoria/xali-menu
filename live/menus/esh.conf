title = "Homes"
size = 27
commands = ["xesh"]
pages {
  catalog { type = "essentials:homes" }
  slots = [0, 1, 2, 3, 4, 5, 6, 7, 8]
  sort = "name"
  item {
    material = stone
    name = "{name}"
    lore = ["{world} {x} {y} {z}"]
    click.left.actions = [ { type = "essentials:home", name = "{name}" }, { type = close } ]
    click.right.actions = [ { type = "essentials:delhome", name = "{name}" } ]
  }
  empty { material = barrier, name = "no homes" }
}
