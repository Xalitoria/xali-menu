title = "Warps {page}"
size = 27
commands = ["xesw"]
pages {
  catalog { type = "essentials:warps" }
  slots = [0, 1, 2, 3, 4, 5, 6, 7, 8]
  sort = "name"
  item {
    material = stone
    name = "{name}"
    lore = ["{world} {x} {y} {z}", "#{index}"]
    click.left.actions = [ { type = "essentials:warp", name = "{name}" }, { type = close } ]
  }
  empty { material = barrier, name = "no warps" }
}
