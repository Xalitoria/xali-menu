    material = diamond, amount = 2
    then = [ { type = message, text = "gem: took {amount} {item}" } ]
    reject = [ { type = message, text = "gem: not that" } ] } }
  pay { material = barrier, slot = 6, name = "Pay 5 gold", accept {
    then = [ { type = take-item, material = gold_ingot, amount = 5 }, { type = message, text = "pay: took {amount} {item}" } ] } }
  again { material = air, slot = 2, accept {
    material = diamond
    then = [ { type = message, text = "again: took {amount} {item}" }, { type = open, menu = d } ] } }
  info { material = book, slot = 8, name = "Info", click.any.actions = [ { type = message, text = "info clicked" } ] }
}
