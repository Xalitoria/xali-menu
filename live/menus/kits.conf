# EssentialsX kit selector menu: /kits (does not override /kit, /ekit or /ekits)
title = "&8Kits &7({page}/{pages})"
size = 45
commands = ["kits"]
open {
  require = [{
    condition { type = "kiteditor:authorized", node = "essentials.kit" }
    deny = [{ type = message, text = "&cYou do not have permission to view kits." }]
  }]
}
matrix {
  cells = [
    "#########"
    "#.......#"
    "#.......#"
    "#.......#"
    "#########"
  ]
  map { "#" = border }
}
pages {
  catalog { type = "kiteditor:kits", usable = false }
  slots = [
    10, 11, 12, 13, 14, 15, 16,
    19, 20, 21, 22, 23, 24, 25,
    28, 29, 30, 31, 32, 33, 34
  ]
  item {
    material = "{icon}"
    name = "&e{name}"
    lore = [
      "&7Items: &f{items}"
      "&7Cooldown: &f{delay_text}"
      "&7Ready: &f{ready}"
      ""
      "&aLeft-click &7to claim"
      "&eRight-click &7to preview"
    ]
    click {
      left.actions = [
        { type = "kiteditor:claim", kit = "{name}" }
        { type = "refresh" }
      ]
      right.actions = [
        { type = "open", menu = "kitpreview", args = ["{name}"] }
      ]
      shift-left {
        require.require = [{ condition { type = "kiteditor:authorized", node = "essentials.createkit" } }]
        actions = [{ type = "open", menu = "kiteditor", args = ["{name}"] }]
      }
    }
  }
  empty {
    material = barrier
    name = "&cNo kits configured"
  }
}
items {
  border {
    material = gray_stained_glass_pane
    name = " "
    hide-tooltip = true
  }
  prev {
    material = arrow
    slot = 38
    priority = -1
    name = "&ePrevious Page"
    lore = ["&7Page {page_prev}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  close {
    material = barrier
    slot = 40
    priority = -1
    name = "&cClose"
    click.any.actions = [{ type = "close" }]
  }
  create {
    material = emerald
    slot = 41
    priority = -1
    name = "&aCreate New Kit"
    lore = ["&7Click to name a new kit", "&7and open it in the editor"]
    view.require = [{ condition { type = "kiteditor:authorized", node = "essentials.createkit" } }]
    click.any {
      require.require = [{
        condition { type = "kiteditor:authorized", node = "essentials.createkit" }
        deny = [{ type = message, text = "&cYou do not have permission to create kits." }]
      }]
      actions = [{
        type = input
        prompt = "&eEnter the name for the new kit (or type 'cancel'):"
        title = "New Kit"
        submit = "Create"
        match = "[A-Za-z0-9_-]+"
        invalid = "&cUse only letters, numbers, _ and -."
        then = [
          { type = "kiteditor:create", kit = "{input}" }
          { type = "open", menu = "kiteditor", args = ["{input}"] }
        ]
      }]
    }
  }
  next {
    material = arrow
    slot = 42
    priority = -1
    name = "&eNext Page"
    lore = ["&7Page {page_next}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
}
