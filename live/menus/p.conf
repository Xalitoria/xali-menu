title = "Inventory"
size = 9
commands = ["xp"]
items {
  close { material = barrier, slot = 4, name = "Close", click.any.actions = [{ type = close }] }
}
# drawn in the player's own inventory, over what is there; the rest of it stays as it is
inventory {
  home { material = compass, slot = 4, name = "Home", click.any.actions = [{ type = message, text = "home clicked" }] }
  coins { material = gold_ingot, slot = 9, name = "Coins: %xalimenu_var_coins:0%", update = true }
  gated { material = emerald, slot = 10, name = "Only in creative", view.require = [{ condition { type = gamemode, modes = [CREATIVE] } }] }
}
