title = "Inventory"
size = 9
commands = ["xp"]
# the items with inventory-slots are drawn in the player's own inventory, over what is there; the rest of it stays as it is
items {
  close { material = barrier, slot = 4, name = "Close", click.any.actions = [{ type = close }] }
  home { material = compass, inventory-slots = [4], name = "Home", click.any.actions = [{ type = message, text = "home clicked" }] }
  coins { material = gold_ingot, inventory-slots = [9], name = "Coins: %xalimenu_var_coins:0%", update = true }
  gated { material = emerald, inventory-slots = [10], name = "Only in creative", require.require = [{ condition { type = gamemode, modes = [CREATIVE] } }] }
}
