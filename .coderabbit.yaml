# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's settings for XaliMenu: what it reviews and what it is told about this code.
language: en-US
early_access: false
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    # Generated, vendored or built: not worth reading.
    - "!editor/web/schema.json"
    - "!editor/web/vendor/**"
    - "!**/build/**"
    - "!gradle/wrapper/**"
    - "!**/*.lock"
  path_instructions:
    - path: "paper/**/*.kt"
      instructions: |
        The Paper/Folia plugin. Folia has no main thread: what touches a player, their inventory or a window runs on the
        player's own scheduler (`player.scheduler`), console commands on the global region scheduler, and nothing here may
        block either. Menu windows are cancelled for every click, and the player's real inventory must never lose, gain or
        duplicate an item: menu items only exist in packets (see `screen/`), and an item a slot takes (`accept`) leaves the
        player only after its actions ran to their end. Flag any change that could break these, a listener that runs the
        wrong side of a scheduler hop, and shutdown paths that leave windows or items behind.
        Kotlin 2.4 conventions: list literals are `[a, b]`, name-based destructuring (`val (key, value) = entry` does not
        work on map entries: use `entry.key`), and a serializable class's companion must not be private.
    - path: "paper/test/**"
      instructions: |
        Unit tests run without a server: players are `java.lang.reflect.Proxy` stubs and Bukkit items can't be built, so a
        test of anything that needs an `ItemStack` or an event belongs in the live harness (`live/`), not here.
    - path: "api/**/*.kt"
      instructions: |
        The API other plugins compile against and that is shaded into the plugin. It must stay plain Kotlin with no Bukkit
        types, and a change to a public type is a change for every add-on: say so when one is breaking.
    - path: "editor/web/**/*.js"
      instructions: |
        The web editor: plain ES modules served as they are, no build step, no framework and no new dependencies. The
        HOCON writer (`hoconWriter.js`) mirrors the plugin's `HoconWriter.kt`; a change to one needs the same change in the
        other. Forms are generated from `schema.json` (which is generated by `:menu:editor:schema` from the plugin's
        classes), so a field is not added by hand.
    - path: "editor/web/test/**"
      instructions: "Node's built-in test runner (`node --test web/test relay/test` from `menu/editor`); no test framework."
    - path: "live/**"
      instructions: |
        The live harness: a throwaway Folia server and mineflayer bots, run by hand, not by the build. Its bots speak the
        26.1 protocol to a 26.2 server, so a packet some version changed has to be written by hand. Check that a bot's
        expectations say what the server must do, not what the bot predicts.
    - path: "**/*.kts"
      instructions: "Gradle build scripts. Dependencies are pinned and optional plugins are soft dependencies (`required = false`)."
  tools:
    # The repository has no config for these, so their defaults would only add noise.
    shellcheck:
      enabled: true
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    detekt:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
