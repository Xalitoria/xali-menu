<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XaliMenu editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><p class="loading">Loading the editor…</p></div>
  <noscript>This editor needs JavaScript.</noscript>
  <script type="module">
    import { boot } from './src/app.js'
    boot().catch((error) => { document.getElementById('app').textContent = `The editor could not start: ${error.message}` })
  </script>
</body>
</html>
