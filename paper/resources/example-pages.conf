# A paged menu: /xmenu-players lists the players who are online, 28 to a page.
title = "&8Players &7({page}/{pages})"
size = 54
commands = ["xmenu-players"]
# Draw again every 2 seconds, so players who join or leave show up.
refresh = 2s
pages {
  catalog { type = "players" }
  # The rows between the border: slots 10-16, 19-25, 28-34 and 37-43.
  slots = [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  sort = "name"
  # The template of every element; {name} and {index} come from the catalog.
  item {
    material = "head:{name}"
    name = "&e{name}"
    lore = ["&7#{index} of {total}", "&7Click to message them"]
    click.left.actions = [{ type = "close" }, { type = "chat", text = "/msg {name} " }]
  }
  empty {
    material = "barrier"
    name = "&cNobody is online"
  }
}
items {
  prev {
    material = "arrow"
    slot = 48
    name = "&aPrevious page"
    lore = ["&7Page {page_prev}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "GT", right = "1" } }]
    click.any.actions = [{ type = "page", by = -1 }]
  }
  info {
    material = "paper"
    slot = 49
    name = "&7Page &f{page}&7 of &f{pages}"
    click.any.actions = [{ type = "page", to = "first" }]
  }
  next {
    material = "arrow"
    slot = 50
    name = "&aNext page"
    lore = ["&7Page {page_next}"]
    view.require = [{ condition { type = "compare", left = "{page}", op = "LT", right = "{pages}" } }]
    click.any.actions = [{ type = "page", by = 1 }]
  }
}
