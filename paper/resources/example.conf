# An example menu: /xmenu-example opens it. The file name is the menu's name.
title = "&8Example &7- &a%player_name%"
size = 27
commands = ["xmenu-example"]
# Draw the items marked `update` again every 5 seconds.
refresh = 5s
items {
  info {
    material = "head:%player_name%"
    slot = 11
    name = "{#ff5555>}%player_name%{#5555ff<}"
    lore = ["&7Your head, with your skin", "&7Click to say hello"]
    update = true
    click.any {
      actions = [
        { type = "message", text = "&aHello, %player_name%!" },
        { type = "sound", sound = "entity.player.levelup" }
      ]
    }
  }
  vip {
    material = "diamond"
    slot = 13
    name = "&bVIP only"
    lore = ["&7Shown when you have xalimenu.example.vip"]
    view.require = [{ condition { type = "permission", node = "xalimenu.example.vip" } }]
  }
  novip {
    material = "barrier"
    slot = 13
    priority = 1
    name = "&cNot a VIP"
  }
  close {
    material = "oak_door"
    slot = 15
    name = "&cClose"
    click.any.actions = [{ type = "close" }]
  }
}
